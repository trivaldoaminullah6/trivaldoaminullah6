<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivaldo Aminullah - Retro Pixel Highway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #050711;
      color: #00ffcc;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 3px solid #00f5ff;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.4), inset 0 0 20px rgba(0, 245, 255, 0.2);
      background: #000;
    }
    canvas {
      display: block;
      background: #0a0d14;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 20, 0.88);
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 20px;
      color: #00ffcc;
      margin-bottom: 14px;
      text-shadow: 0 0 10px #00ffcc;
    }
    p {
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.8;
      margin-bottom: 22px;
    }
    .btn {
      font-family: 'Press Start 2P', monospace;
      background: #00ffcc;
      color: #050711;
      border: none;
      padding: 14px 28px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 15px #00ffcc;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #fff;
      box-shadow: 0 0 25px #fff;
      transform: scale(1.05);
    }
    .controls-bar {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      font-size: 9px;
      color: #64748b;
    }
    #touch-controls {
      display: none;
      margin-top: 15px;
      gap: 15px;
    }
    @media (max-width: 768px) {
      #touch-controls {
        display: flex;
      }
      .controls-bar {
        display: none;
      }
    }
    .touch-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(0, 245, 255, 0.2);
      border: 2px solid #00f5ff;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="500"></canvas>

    <div id="ui-overlay">
      <h1 id="overlay-title">RETRO PIXEL HIGHWAY</h1>
      <p id="overlay-sub">DRIVER: TRIVALDO AMINULLAH<br>DODGE TRAFFIC &amp; SURVIVE THE HIGHWAY</p>
      <button class="btn" id="start-btn">START RACE</button>
      <p style="margin-top: 25px; font-size: 8px; color: #475569;">
        [◀ / ▶] STEER &nbsp;|&nbsp; [▲] ACCEL &nbsp;|&nbsp; [SPACE] NITRO
      </p>
    </div>
  </div>

  <div class="controls-bar">
    <span>[← / A] STEER LEFT</span>
    <span>[→ / D] STEER RIGHT</span>
    <span>[↑ / W] GAS</span>
    <span>[SPACE] NITRO BOOST</span>
    <span>[M] MUTE</span>
  </div>

  <div id="touch-controls">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-nitro" style="background: rgba(0, 255, 204, 0.3); border-color: #00ffcc; width: 65px; height: 65px;">⚡</button>
    <button class="touch-btn" id="btn-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiOverlay = document.getElementById('ui-overlay');
    const startBtn = document.getElementById('start-btn');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');

    // Web Audio Synthesizer
    let audioCtx = null;
    let soundEnabled = true;

    function playTone(freq, type, duration, vol = 0.08) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundEngine() { playTone(80 + Math.random() * 40, 'triangle', 0.08, 0.03); }
    function soundNitro() { playTone(240, 'sawtooth', 0.15, 0.06); }
    function soundCrash() { playTone(60, 'sawtooth', 0.4, 0.2); }

    // Game State
    let gameState = 'START';
    let score = 0;
    let distance = 0;
    let speed = 0;
    const maxNormalSpeed = 160;
    const maxNitroSpeed = 240;

    // Keys
    const keys = { left: false, right: false, up: false, space: false };

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
      if (e.code === 'Space') keys.space = true;
      if (e.code === 'KeyM') soundEnabled = !soundEnabled;
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
      if (e.code === 'Space') keys.space = false;
    });

    // Touch
    document.getElementById('btn-left').addEventListener('touchstart', e => { e.preventDefault(); keys.left = true; });
    document.getElementById('btn-left').addEventListener('touchend', () => { keys.left = false; });
    document.getElementById('btn-right').addEventListener('touchstart', e => { e.preventDefault(); keys.right = true; });
    document.getElementById('btn-right').addEventListener('touchend', () => { keys.right = false; });
    document.getElementById('btn-nitro').addEventListener('touchstart', e => { e.preventDefault(); keys.space = true; });
    document.getElementById('btn-nitro').addEventListener('touchend', () => { keys.space = false; });

    // Highway Road Config
    const roadX = 90;
    const roadWidth = 420;
    const lanes = [roadX + 35, roadX + 135, roadX + 245, roadX + 345];
    let roadOffset = 0;

    // Player Car
    const player = {
      x: canvas.width / 2 - 18,
      y: canvas.height - 90,
      w: 36,
      h: 64,
      vx: 0
    };

    // Traffic Cars
    let traffic = [];
    let particles = [];
    let nitroFuel = 100;

    function spawnTraffic() {
      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      // Prevent overlapping spawns
      const busy = traffic.some(t => Math.abs(t.x - lane) < 20 && t.y < 80);
      if (!busy) {
        const types = [
          { color: '#facc15', speed: 2 + Math.random() * 2 },
          { color: '#0284c7', speed: 3 + Math.random() * 2 },
          { color: '#7c3aed', speed: 1.5 + Math.random() * 1.5 }
        ];
        const chosen = types[Math.floor(Math.random() * types.length)];
        traffic.push({
          x: lane,
          y: -80,
          w: 34,
          h: 58,
          color: chosen.color,
          speed: chosen.speed
        });
      }
    }

    function resetGame() {
      score = 0;
      distance = 0;
      speed = 60;
      nitroFuel = 100;
      player.x = canvas.width / 2 - 18;
      player.vx = 0;
      traffic = [];
      particles = [];
    }

    startBtn.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      resetGame();
      gameState = 'PLAYING';
      uiOverlay.style.display = 'none';
    });

    function gameOver() {
      gameState = 'GAMEOVER';
      soundCrash();
      overlayTitle.innerText = 'CRASH!';
      overlayTitle.style.color = '#ef4444';
      overlaySub.innerHTML = `DISTANCE: ${Math.floor(distance)} KM<br>SCORE: ${score}`;
      startBtn.innerText = 'RACE AGAIN';
      uiOverlay.style.display = 'flex';
    }

    // Main Update Loop
    let lastSpawn = 0;

    function update() {
      if (gameState !== 'PLAYING') return;

      // Speed handling
      let targetSpeed = keys.up ? maxNormalSpeed : 100;
      let isNitro = false;

      if (keys.space && nitroFuel > 0) {
        targetSpeed = maxNitroSpeed;
        nitroFuel -= 0.6;
        isNitro = true;
        if (Math.random() > 0.4) soundNitro();
      } else if (nitroFuel < 100) {
        nitroFuel += 0.15;
      }

      speed += (targetSpeed - speed) * 0.05;
      distance += speed * 0.0008;
      score += Math.floor(speed * 0.04);
      roadOffset = (roadOffset + speed * 0.12) % 60;

      // Player Movement
      if (keys.left) player.vx = -5;
      else if (keys.right) player.vx = 5;
      else player.vx *= 0.7;

      player.x += player.vx;
      if (player.x < roadX + 8) player.x = roadX + 8;
      if (player.x > roadX + roadWidth - player.w - 8) player.x = roadX + roadWidth - player.w - 8;

      // Engine audio tick
      if (Math.random() > 0.7) soundEngine();

      // Spawn traffic
      const now = Date.now();
      if (now - lastSpawn > Math.max(700, 2200 - speed * 8)) {
        spawnTraffic();
        lastSpawn = now;
      }

      // Update traffic
      traffic.forEach(t => {
        // Relative speed
        t.y += (speed * 0.06 - t.speed);
      });
      traffic = traffic.filter(t => t.y < canvas.height + 100 && t.y > -150);

      // Collisions
      traffic.forEach(t => {
        if (
          player.x < t.x + t.w - 4 &&
          player.x + player.w > t.x + 4 &&
          player.y < t.y + t.h - 6 &&
          player.y + player.h > t.y + 6
        ) {
          gameOver();
        }
      });

      // Tire smoke & Nitro flames particles
      if (isNitro || Math.abs(player.vx) > 3) {
        particles.push({
          x: player.x + 8 + Math.random() * (player.w - 16),
          y: player.y + player.h,
          vx: (Math.random() - 0.5) * 2,
          vy: 2 + Math.random() * 3,
          life: 15,
          color: isNitro ? (Math.random() > 0.5 ? '#00f5ff' : '#ff0055') : '#64748b'
        });
      }
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grass / Sidewalks
      ctx.fillStyle = '#050711';
      ctx.fillRect(0, 0, roadX, canvas.height);
      ctx.fillRect(roadX + roadWidth, 0, canvas.width - (roadX + roadWidth), canvas.height);

      // Asphalt Road
      ctx.fillStyle = '#111827';
      ctx.fillRect(roadX, 0, roadWidth, canvas.height);

      // Curbs (Striped Red & White)
      const curbSize = 30;
      for (let y = -curbSize; y < canvas.height + curbSize; y += curbSize) {
        const isRed = Math.floor((y + roadOffset) / curbSize) % 2 === 0;
        ctx.fillStyle = isRed ? '#ef4444' : '#ffffff';
        ctx.fillRect(roadX - 8, y + roadOffset, 8, curbSize);
        ctx.fillRect(roadX + roadWidth, y + roadOffset, 8, curbSize);
      }

      // Dashed Lane Dividers
      const dashH = 26;
      const gapH = 24;
      ctx.fillStyle = '#facc15';
      [roadX + 105, roadX + 210, roadX + 315].forEach(lx => {
        for (let y = -dashH; y < canvas.height + dashH; y += dashH + gapH) {
          ctx.fillRect(lx, y + (roadOffset % (dashH + gapH)), 4, dashH);
        }
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
      });

      // Traffic Cars
      traffic.forEach(t => {
        // Shadow
        ctx.fillStyle = '#00000066';
        ctx.fillRect(t.x + 2, t.y + 4, t.w, t.h);
        // Body
        ctx.fillStyle = t.color;
        ctx.fillRect(t.x, t.y, t.w, t.h);
        // Windshield
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(t.x + 4, t.y + 12, t.w - 8, 12);
        ctx.fillRect(t.x + 4, t.y + t.h - 18, t.w - 8, 8);
        // Taillights
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(t.x + 4, t.y + t.h - 3, 6, 3);
        ctx.fillRect(t.x + t.w - 10, t.y + t.h - 3, 6, 3);
      });

      // Player Car (Red Sports Car)
      // Shadow
      ctx.fillStyle = '#00000088';
      ctx.fillRect(player.x + 2, player.y + 6, player.w, player.h);
      // Body
      ctx.fillStyle = '#e6002e';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      // Roof / Hood details
      ctx.fillStyle = '#b30024';
      ctx.fillRect(player.x + 4, player.y + 16, player.w - 8, player.h - 32);
      // Windshield
      ctx.fillStyle = '#00f5ff';
      ctx.fillRect(player.x + 6, player.y + 12, player.w - 12, 10);
      ctx.fillStyle = '#082b3d';
      ctx.fillRect(player.x + 6, player.y + player.h - 20, player.w - 12, 6);
      // Spoiler
      ctx.fillStyle = '#181824';
      ctx.fillRect(player.x + 2, player.y + player.h - 4, player.w - 4, 4);
      // Glowing Taillights
      ctx.fillStyle = '#ff0055';
      ctx.fillRect(player.x + 4, player.y + player.h - 2, 7, 3);
      ctx.fillRect(player.x + player.w - 11, player.y + player.h - 2, 7, 3);

      // HUD Bar
      if (gameState === 'PLAYING') {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, 34);
        ctx.fillStyle = '#334155';
        ctx.fillRect(0, 34, canvas.width, 2);

        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = '#facc15';
        ctx.fillText(`${Math.floor(speed)} KM/H`, 15, 22);

        ctx.fillStyle = '#00ffcc';
        ctx.fillText(`SCORE: ${score}`, 180, 22);

        ctx.fillStyle = '#64748b';
        ctx.fillText(`NITRO`, 380, 22);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(445, 12, 120, 12);
        ctx.fillStyle = '#00f5ff';
        ctx.fillRect(447, 14, (nitroFuel / 100) * 116, 8);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
