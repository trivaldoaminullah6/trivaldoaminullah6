<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivaldo Aminullah - Retro Space Invaders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #050711;
      color: #00ffcc;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 3px solid #00f5ff;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.4), inset 0 0 20px rgba(0, 245, 255, 0.2);
      background: #000;
    }
    canvas {
      display: block;
      background: #050714;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 20, 0.85);
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 20px;
      color: #00ffcc;
      margin-bottom: 12px;
      text-shadow: 0 0 10px #00ffcc;
    }
    p {
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.8;
      margin-bottom: 20px;
    }
    .btn {
      font-family: 'Press Start 2P', monospace;
      background: #00ffcc;
      color: #050711;
      border: none;
      padding: 14px 28px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 15px #00ffcc;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #fff;
      box-shadow: 0 0 25px #fff;
      transform: scale(1.05);
    }
    .controls-bar {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      font-size: 9px;
      color: #64748b;
    }
    /* Mobile Touch Controls */
    #touch-controls {
      display: none;
      margin-top: 15px;
      gap: 15px;
    }
    @media (max-width: 768px) {
      #touch-controls {
        display: flex;
      }
      .controls-bar {
        display: none;
      }
    }
    .touch-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(0, 245, 255, 0.2);
      border: 2px solid #00f5ff;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="480"></canvas>

    <div id="ui-overlay">
      <h1 id="overlay-title">SPACE DEFENDER</h1>
      <p id="overlay-sub">PILOT: TRIVALDO AMINULLAH<br>DEFEND THE CYBER GALAXY!</p>
      <button class="btn" id="start-btn">START MISSION</button>
      <p style="margin-top: 25px; font-size: 8px; color: #475569;">
        [◀ / ▶] MOVE &nbsp;|&nbsp; [SPACE] FIRE LASERS
      </p>
    </div>
  </div>

  <div class="controls-bar">
    <span>[← / A] LEFT</span>
    <span>[→ / D] RIGHT</span>
    <span>[SPACE] SHOOT</span>
    <span>[M] MUTE AUDIO</span>
  </div>

  <div id="touch-controls">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-fire" style="background: rgba(255, 0, 85, 0.3); border-color: #ff0055; width: 70px; height: 70px;">⚡</button>
    <button class="touch-btn" id="btn-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiOverlay = document.getElementById('ui-overlay');
    const startBtn = document.getElementById('start-btn');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');

    // Web Audio Synthesizer (No external mp3)
    let audioCtx = null;
    let soundEnabled = true;

    function playTone(freq, type, duration) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundShoot() { playTone(880, 'square', 0.1); }
    function soundHit() { playTone(220, 'sawtooth', 0.15); }
    function soundOver() { playTone(120, 'sine', 0.6); }

    // State
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let lives = 3;
    let wave = 1;

    // Keys
    const keys = { left: false, right: false, space: false };

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space') {
        keys.space = true;
        if (gameState === 'PLAYING') shootLaser();
        e.preventDefault();
      }
      if (e.code === 'KeyM') soundEnabled = !soundEnabled;
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space') keys.space = false;
    });

    // Touch controls
    document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    document.getElementById('btn-left').addEventListener('touchend', () => { keys.left = false; });
    document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    document.getElementById('btn-right').addEventListener('touchend', () => { keys.right = false; });
    document.getElementById('btn-fire').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'PLAYING') shootLaser();
    });

    // Starfield Background
    const stars = Array.from({ length: 60 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: 0.5 + Math.random() * 2,
      size: Math.random() > 0.8 ? 2 : 1
    }));

    // Player
    const player = {
      x: canvas.width / 2 - 18,
      y: canvas.height - 50,
      w: 36,
      h: 24,
      speed: 5
    };

    let lasers = [];
    let enemyLasers = [];
    let enemies = [];
    let particles = [];

    function initEnemies() {
      enemies = [];
      const rows = 4;
      const cols = 8;
      const xOffset = 60;
      const yOffset = 50;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: xOffset + c * 60,
            y: yOffset + r * 35,
            w: 28,
            h: 20,
            color: r === 0 ? '#ff00aa' : r < 3 ? '#00ff88' : '#ffcc00',
            alive: true
          });
        }
      }
    }

    let enemyDir = 1;
    let enemyStepDown = false;
    let lastEnemyShoot = 0;

    function shootLaser() {
      if (lasers.length < 5) {
        lasers.push({ x: player.x + player.w / 2 - 2, y: player.y - 4, w: 4, h: 12, speed: 8 });
        soundShoot();
      }
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 25,
          color
        });
      }
      soundHit();
    }

    function resetGame() {
      score = 0;
      lives = 3;
      wave = 1;
      player.x = canvas.width / 2 - 18;
      lasers = [];
      enemyLasers = [];
      particles = [];
      initEnemies();
    }

    startBtn.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      resetGame();
      gameState = 'PLAYING';
      uiOverlay.style.display = 'none';
    });

    function gameOver() {
      gameState = 'GAMEOVER';
      soundOver();
      overlayTitle.innerText = 'MISSION FAILED';
      overlayTitle.style.color = '#ff0055';
      overlaySub.innerHTML = `FINAL SCORE: ${score}<br>WAVE REACHED: ${wave}`;
      startBtn.innerText = 'PLAY AGAIN';
      uiOverlay.style.display = 'flex';
    }

    // Main Loop
    function update() {
      // Move Stars
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) {
          s.y = 0;
          s.x = Math.random() * canvas.width;
        }
      });

      if (gameState !== 'PLAYING') return;

      // Player Movement
      if (keys.left && player.x > 5) player.x -= player.speed;
      if (keys.right && player.x < canvas.width - player.w - 5) player.x += player.speed;

      // Lasers Move
      lasers.forEach(l => l.y -= l.speed);
      lasers = lasers.filter(l => l.y > -10);

      // Enemy Lasers Move
      enemyLasers.forEach(el => el.y += el.speed);
      enemyLasers = enemyLasers.filter(el => el.y < canvas.height + 10);

      // Enemy Movement
      let hitEdge = false;
      const aliveEnemies = enemies.filter(e => e.alive);

      if (aliveEnemies.length === 0) {
        wave++;
        initEnemies();
        return;
      }

      aliveEnemies.forEach(e => {
        if ((enemyDir === 1 && e.x + e.w > canvas.width - 20) || (enemyDir === -1 && e.x < 20)) {
          hitEdge = true;
        }
      });

      if (hitEdge) {
        enemyDir *= -1;
        aliveEnemies.forEach(e => e.y += 12);
      } else {
        aliveEnemies.forEach(e => e.x += enemyDir * (1 + wave * 0.3));
      }

      // Enemy Shooting
      const now = Date.now();
      if (now - lastEnemyShoot > Math.max(500, 1500 - wave * 100)) {
        const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
        if (shooter) {
          enemyLasers.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 3, h: 10, speed: 4 });
          lastEnemyShoot = now;
        }
      }

      // Collisions: Player Lasers -> Enemies
      lasers.forEach((l, lIdx) => {
        aliveEnemies.forEach(e => {
          if (l.x < e.x + e.w && l.x + l.w > e.x && l.y < e.y + e.h && l.y + l.h > e.y) {
            e.alive = false;
            lasers.splice(lIdx, 1);
            score += 100;
            createExplosion(e.x + e.w / 2, e.y + e.h / 2, e.color);
          }
        });
      });

      // Collisions: Enemy Lasers -> Player
      enemyLasers.forEach((el, elIdx) => {
        if (el.x < player.x + player.w && el.x + el.w > player.x && el.y < player.y + player.h && el.y + el.h > player.y) {
          enemyLasers.splice(elIdx, 1);
          lives--;
          createExplosion(player.x + player.w / 2, player.y + player.h / 2, '#00ffff');
          if (lives <= 0) gameOver();
        }
      });

      // Enemy reaching bottom
      aliveEnemies.forEach(e => {
        if (e.y + e.h >= player.y) {
          gameOver();
        }
      });

      // Particles
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Player Ship (Pixel Art Style)
      ctx.fillStyle = '#00ffff';
      ctx.fillRect(player.x, player.y + 12, player.w, 10); // Base wings
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(player.x + 12, player.y, 12, 20); // Hull
      ctx.fillStyle = '#ff0055';
      ctx.fillRect(player.x + 16, player.y + 4, 4, 8); // Cockpit

      // Jet Flames
      if (gameState === 'PLAYING') {
        ctx.fillStyle = Math.random() > 0.5 ? '#ffaa00' : '#ff3300';
        ctx.fillRect(player.x + 14, player.y + 22, 8, 8 + Math.random() * 6);
      }

      // Lasers
      ctx.fillStyle = '#00ffcc';
      lasers.forEach(l => ctx.fillRect(l.x, l.y, l.w, l.h));

      // Enemy Lasers
      ctx.fillStyle = '#ff0055';
      enemyLasers.forEach(el => ctx.fillRect(el.x, el.y, el.w, el.h));

      // Enemies
      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = e.color;
        // Simple Pixel Invader Shape
        ctx.fillRect(e.x + 4, e.y, e.w - 8, e.h);
        ctx.fillRect(e.x, e.y + 4, e.w, e.h - 8);
        ctx.fillStyle = '#050714';
        ctx.fillRect(e.x + 6, e.y + 6, 4, 4); // Eyes
        ctx.fillRect(e.x + e.w - 10, e.y + 6, 4, 4);
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });

      // HUD
      if (gameState === 'PLAYING') {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillText(`SCORE: ${score}`, 20, 24);
        ctx.fillText(`WAVE: ${wave}`, canvas.width / 2 - 35, 24);
        ctx.fillText(`LIVES: ${'♥ '.repeat(lives)}`, canvas.width - 140, 24);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
