<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Diagnostic</title>
<style>
  body { margin:0; background:#000; color:#0f0; font-family:monospace; overflow:hidden; cursor:pointer; }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-size:24px; text-align:center; padding:20px; }
  #log { white-space:pre; padding:15px; display:none; font-size:14px; line-height:1.4; }
  #end { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
         background:#000; color:#fff; font-size:28px; text-align:center; padding:20px; line-height:1.6; }
</style>
</head>
<body>
<div id="start">Klik di mana saja untuk lanjut...</div>
<div id="log"></div>
<div id="end">😄 Bercanda! Ini cuma prank dari README-ku.<br>Tekan Esc untuk keluar.</div>

<script>
const lines = [
  "Initializing exploit...",
  "Bypassing firewall...",
  "Accessing /root ...",
  "Encrypting files 12%",
  "Encrypting files 57%",
  "Encrypting files 99%",
  "SYSTEM COMPROMISED"
];
const log = document.getElementById('log');

document.body.addEventListener('click', async () => {
  if (document.getElementById('start').style.display === 'none') return;
  document.getElementById('start').style.display = 'none';
  try { await document.documentElement.requestFullscreen(); } catch(e) {}
  log.style.display = 'block';

  const timer = setInterval(() => {
    const hex = Array.from({length:6}, () =>
      Math.random().toString(16).slice(2,10)).join(' ');
    log.textContent += hex + "\n" + lines[Math.floor(Math.random()*lines.length)] + "\n";
    window.scrollTo(0, document.body.scrollHeight);
  }, 60);

  setTimeout(() => {
    clearInterval(timer);
    log.style.display = 'none';
    document.getElementById('end').style.display = 'flex';
  }, 6000);
}, { once:true });
</script>
</body>
</html>
