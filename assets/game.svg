<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="60%" stop-color="#0c1633"/>
      <stop offset="100%" stop-color="#1b1238"/>
    </linearGradient>

    <!-- Asphalt Highway Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Nitro Fire Gradient -->
    <linearGradient id="nitroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="40%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#9900ff"/>
    </linearGradient>

    <!-- Nitro Fire Orange Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffff00"/>
      <stop offset="50%" stop-color="#ff3300"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <!-- Taillight Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pixel Player Car (Red Sports Car) -->
    <g id="playerCar">
      <!-- Shadow -->
      <rect x="2" y="10" width="44" height="76" rx="6" fill="#000000" opacity="0.6"/>

      <!-- Rear Tires -->
      <rect x="0"  y="52" width="6" height="18" rx="2" fill="#111111"/>
      <rect x="42" y="52" width="6" height="18" rx="2" fill="#111111"/>
      <!-- Front Tires -->
      <rect x="0"  y="12" width="6" height="16" rx="2" fill="#111111"/>
      <rect x="42" y="12" width="6" height="16" rx="2" fill="#111111"/>

      <!-- Main Body Chassis (Red Supercar) -->
      <path d="M 6,18 L 12,4 L 36,4 L 42,18 L 44,56 L 40,74 L 8,74 L 4,56 Z" fill="#e6002e"/>
      <!-- Dark Accents / Aerodynamic curves -->
      <path d="M 14,4 L 34,4 L 38,18 L 10,18 Z" fill="#b30024"/>
      <rect x="6" y="24" width="36" height="38" fill="#e6002e"/>
      <rect x="10" y="22" width="28" height="4" fill="#99001f"/>

      <!-- Cabin / Windshield (Tinted Cyan Glass) -->
      <polygon points="12,20 36,20 38,36 10,36" fill="#0ff" opacity="0.85"/>
      <!-- Cabin Roof -->
      <rect x="14" y="34" width="20" height="16" fill="#181824"/>
      <!-- Rear Window -->
      <polygon points="12,50 36,50 38,58 10,58" fill="#082b3d" opacity="0.9"/>

      <!-- Side Mirrors -->
      <rect x="2"  y="24" width="3" height="5" fill="#e6002e"/>
      <rect x="43" y="24" width="3" height="5" fill="#e6002e"/>

      <!-- Rear Wing Spoiler -->
      <rect x="6"  y="70" width="36" height="5" rx="1" fill="#181824"/>
      <rect x="10" y="67" width="4" height="4" fill="#333333"/>
      <rect x="34" y="67" width="4" height="4" fill="#333333"/>

      <!-- Glowing Red Neon Taillights -->
      <rect x="8"  y="72" width="10" height="3" fill="#ff0044" filter="url(#glow)"/>
      <rect x="30" y="72" width="10" height="3" fill="#ff0044" filter="url(#glow)"/>
      <rect x="9"  y="72.5" width="8" height="2" fill="#ffffff"/>
      <rect x="31" y="72.5" width="8" height="2" fill="#ffffff"/>

      <!-- Dual Exhaust Pipes with Animated Nitro Boost Flames -->
      <g transform="translate(14, 76)">
        <polygon points="0,0 2,16 4,0" fill="url(#fireGrad)">
          <animate attributeName="points" values="0,0 2,14 4,0; 0,0 2,22 4,0; 0,0 2,12 4,0; 0,0 2,20 4,0" dur="0.12s" repeatCount="indefinite"/>
        </polygon>
        <polygon points="1,0 2,10 3,0" fill="url(#nitroGrad)">
          <animate attributeName="points" values="1,0 2,10 3,0; 1,0 2,16 3,0; 1,0 2,8 3,0; 1,0 2,14 3,0" dur="0.15s" repeatCount="indefinite"/>
        </polygon>
      </g>
      <g transform="translate(30, 76)">
        <polygon points="0,0 2,16 4,0" fill="url(#fireGrad)">
          <animate attributeName="points" values="0,0 2,20 4,0; 0,0 2,12 4,0; 0,0 2,22 4,0; 0,0 2,14 4,0" dur="0.13s" repeatCount="indefinite"/>
        </polygon>
        <polygon points="1,0 2,10 3,0" fill="url(#nitroGrad)">
          <animate attributeName="points" values="1,0 2,14 3,0; 1,0 2,8 3,0; 1,0 2,16 3,0; 1,0 2,10 3,0" dur="0.14s" repeatCount="indefinite"/>
        </polygon>
      </g>

      <!-- Headlight Beam Reflections on hood -->
      <polygon points="12,6 16,6 15,12 11,12" fill="#ffffff" opacity="0.6"/>
      <polygon points="36,6 32,6 33,12 37,12" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Traffic Car A (Yellow Cyber Cab) -->
    <g id="trafficYellow">
      <rect x="0" y="8" width="40" height="66" rx="4" fill="#000000" opacity="0.5"/>
      <!-- Tires -->
      <rect x="0" y="10" width="4" height="14" fill="#111"/>
      <rect x="36" y="10" width="4" height="14" fill="#111"/>
      <rect x="0" y="46" width="4" height="14" fill="#111"/>
      <rect x="36" y="46" width="4" height="14" fill="#111"/>
      <!-- Body -->
      <rect x="3" y="4" width="34" height="62" rx="4" fill="#facc15"/>
      <rect x="6" y="16" width="28" height="12" fill="#1e293b"/>
      <rect x="8" y="32" width="24" height="16" fill="#0f172a"/>
      <rect x="6" y="52" width="28" height="8" fill="#1e293b"/>
      <!-- Lights -->
      <rect x="5" y="64" width="8" height="2" fill="#ef4444"/>
      <rect x="27" y="64" width="8" height="2" fill="#ef4444"/>
    </g>

    <!-- Traffic Car B (Cyan Cyber Cruiser) -->
    <g id="trafficCyan">
      <rect x="0" y="8" width="42" height="70" rx="4" fill="#000000" opacity="0.5"/>
      <!-- Tires -->
      <rect x="0" y="12" width="4" height="14" fill="#111"/>
      <rect x="38" y="12" width="4" height="14" fill="#111"/>
      <rect x="0" y="50" width="4" height="14" fill="#111"/>
      <rect x="38" y="50" width="4" height="14" fill="#111"/>
      <!-- Body -->
      <rect x="3" y="4" width="36" height="66" rx="4" fill="#0284c7"/>
      <polygon points="6,18 36,18 32,32 10,32" fill="#0f172a"/>
      <rect x="8" y="34" width="26" height="18" fill="#0369a1"/>
      <polygon points="8,54 34,54 36,62 6,62" fill="#0f172a"/>
      <!-- Taillights -->
      <rect x="6" y="68" width="9" height="2" fill="#f43f5e"/>
      <rect x="27" y="68" width="9" height="2" fill="#f43f5e"/>
    </g>

    <!-- Traffic Car C (Purple Heavy Van) -->
    <g id="trafficPurple">
      <rect x="0" y="8" width="44" height="78" rx="4" fill="#000000" opacity="0.5"/>
      <rect x="0" y="14" width="4" height="16" fill="#111"/>
      <rect x="40" y="14" width="4" height="16" fill="#111"/>
      <rect x="0" y="54" width="4" height="16" fill="#111"/>
      <rect x="40" y="54" width="4" height="16" fill="#111"/>
      <rect x="3" y="4" width="38" height="74" rx="4" fill="#7c3aed"/>
      <rect x="6" y="14" width="32" height="10" fill="#1e1b4b"/>
      <rect x="6" y="28" width="32" height="42" fill="#6d28d9"/>
      <!-- Taillights -->
      <rect x="5" y="75" width="8" height="3" fill="#ff0055"/>
      <rect x="31" y="75" width="8" height="3" fill="#ff0055"/>
    </g>

    <style>
      .retro {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .hudValue { fill: #00ffcc; font-weight: bold; }
      .hudLabel { fill: #64748b; }
      .hudAlert { fill: #f43f5e; }
      .hudSpeed { fill: #facc15; font-size: 13px; font-weight: bold; }
    </style>
  </defs>

  <!-- ================= CANVAS BACKGROUND ================= -->
  <rect width="840" height="460" rx="12" fill="url(#skyGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- ================= CYBER CITY SKYLINE & HORIZON ================= -->
  <!-- Distant City Silhouette -->
  <g fill="#0b1120" opacity="0.9">
    <rect x="20"  y="20" width="35" height="50"/>
    <rect x="60"  y="35" width="25" height="35"/>
    <rect x="90"  y="15" width="45" height="55"/>
    <rect x="140" y="28" width="30" height="42"/>
    <rect x="175" y="10" width="20" height="60"/>
    <rect x="200" y="32" width="40" height="38"/>
    <!-- Center City Spire -->
    <polygon points="420,5 410,70 430,70"/>
    <rect x="380" y="25" width="30" height="45"/>
    <rect x="430" y="20" width="35" height="50"/>
    <!-- Right Skyline -->
    <rect x="640" y="18" width="25" height="52"/>
    <rect x="670" y="30" width="35" height="40"/>
    <rect x="710" y="12" width="40" height="58"/>
    <rect x="755" y="26" width="30" height="44"/>
    <rect x="790" y="35" width="35" height="35"/>
  </g>

  <!-- Distant Building Window Pixels -->
  <g fill="#38bdf8" opacity="0.6">
    <rect x="95" y="20" width="2" height="3"/>
    <rect x="105" y="20" width="2" height="3"/>
    <rect x="115" y="20" width="2" height="3"/>
    <rect x="95" y="30" width="2" height="3"/>
    <rect x="115" y="30" width="2" height="3"/>
    <rect x="180" y="16" width="2" height="4"/>
    <rect x="185" y="16" width="2" height="4"/>
    <rect x="419" y="10" width="2" height="8" fill="#ff0055"/>
    <rect x="715" y="20" width="2" height="3"/>
    <rect x="735" y="20" width="2" height="3"/>
    <rect x="725" y="28" width="2" height="3"/>
  </g>

  <!-- Cyber Horizon Line -->
  <line x1="20" y1="70" x2="820" y2="70" stroke="#00f5ff" stroke-width="1.5" opacity="0.4"/>

  <!-- ================= 4-LANE HIGHWAY SURFACE ================= -->
  <!-- Highway Base -->
  <polygon points="300,70 540,70 700,430 140,430" fill="url(#roadGrad)"/>

  <!-- Road Side Curbs (Red & White Striped Curb Barrier) -->
  <!-- Left Curb Animated -->
  <g>
    <polygon points="300,70 292,70 128,430 140,430" fill="#991b1b"/>
    <!-- Moving White Curb Teeth -->
    <g fill="#f8fafc">
      <polygon points="296,80 292,80 270,130 275,130">
        <animate attributeName="points" values="296,70 292,70 286,85 290,85; 260,150 254,150 230,210 237,210; 200,280 192,280 156,360 166,360; 150,380 142,380 128,430 140,430" dur="0.28s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- Right Curb Animated -->
  <g>
    <polygon points="540,70 548,70 712,430 700,430" fill="#991b1b"/>
    <!-- Moving White Curb Teeth -->
    <g fill="#f8fafc">
      <polygon points="544,80 548,80 570,130 565,130">
        <animate attributeName="points" values="544,70 548,70 554,85 550,85; 580,150 586,150 610,210 603,210; 640,280 648,280 684,360 674,360; 690,380 698,380 712,430 700,430" dur="0.28s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- ================= ANIMATED DASHED HIGHWAY LANE MARKINGS ================= -->
  <!-- Lane 1-2 Divider (Left-Center) -->
  <g stroke="#facc15" stroke-width="3" opacity="0.8">
    <line x1="360" y1="70" x2="280" y2="430" stroke-dasharray="24,28">
      <animate attributeName="stroke-dashoffset" from="0" to="-104" dur="0.24s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Center Highway Divider (Double Solid Cyan/White) -->
  <g stroke="#00f5ff" stroke-width="3.5" opacity="0.9">
    <line x1="420" y1="70" x2="420" y2="430" stroke-dasharray="32,24">
      <animate attributeName="stroke-dashoffset" from="0" to="-112" dur="0.24s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Lane 3-4 Divider (Right-Center) -->
  <g stroke="#facc15" stroke-width="3" opacity="0.8">
    <line x1="480" y1="70" x2="560" y2="430" stroke-dasharray="24,28">
      <animate attributeName="stroke-dashoffset" from="0" to="-104" dur="0.24s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Highway Speed Motion Streaks -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.25">
    <line x1="220" y1="200" x2="200" y2="280">
      <animate attributeName="y1" from="100" to="400" dur="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y2" from="180" to="480" dur="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="620" y1="180" x2="640" y2="260">
      <animate attributeName="y1" from="90" to="390" dur="0.32s" repeatCount="indefinite"/>
      <animate attributeName="y2" from="170" to="470" dur="0.32s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ================= TRAFFIC CARS (OBSTACLES SCROLLING DOWN) ================= -->
  <!-- Traffic Car 1: Yellow Cab in Lane 1 (Moving Down at High Speed) -->
  <g>
    <use href="#trafficYellow" x="220" y="0"/>
    <animateTransform attributeName="transform" type="translate"
      from="0, -100" to="0, 500"
      dur="3.8s" begin="0.2s" repeatCount="indefinite"/>
  </g>

  <!-- Traffic Car 2: Cyan Cruiser in Lane 4 (Right Lane) -->
  <g>
    <use href="#trafficCyan" x="570" y="0"/>
    <animateTransform attributeName="transform" type="translate"
      from="0, -120" to="0, 520"
      dur="4.5s" begin="1.8s" repeatCount="indefinite"/>
  </g>

  <!-- Traffic Car 3: Heavy Purple Cruiser in Center-Right Lane -->
  <g>
    <use href="#trafficPurple" x="460" y="0"/>
    <animateTransform attributeName="transform" type="translate"
      from="0, -140" to="0, 540"
      dur="5.2s" begin="3.1s" repeatCount="indefinite"/>
  </g>

  <!-- ================= FLOATING SPEED BOOST / SCORE POPUP ================= -->
  <g transform="translate(370, 240)">
    <g>
      <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.2; 0.6; 0.9; 1" dur="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,-30; 0,-50; 0,-60" dur="2.4s" repeatCount="indefinite"/>
      <rect x="-10" y="-14" width="90" height="20" rx="3" fill="#000" stroke="#00f5ff" stroke-width="1.2" opacity="0.8"/>
      <text x="0" y="0" class="retro" fill="#00ffcc" font-weight="bold">+500 PTS</text>
    </g>
  </g>

  <!-- ================= PLAYER CAR (SMOOTH LANE-SWITCHING & OVERTAKE) ================= -->
  <g>
    <!-- Dynamic Swerving: Dodges Yellow Car, Cuts Across Center, Overtakes Purple Van, Centers -->
    <animateTransform attributeName="transform" type="translate"
      values="396,310; 490,310; 490,310; 340,310; 340,310; 430,310; 396,310"
      keyTimes="0; 0.22; 0.35; 0.58; 0.72; 0.88; 1"
      dur="6.5s" repeatCount="indefinite"/>

    <!-- Player Car Sprite -->
    <use href="#playerCar" x="0" y="0"/>

    <!-- Left & Right Tire Smoke Particles during High-Speed Drift -->
    <circle cx="2" cy="74" r="3" fill="#64748b" opacity="0.6">
      <animate attributeName="r" values="2; 8; 12; 0" dur="0.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7; 0.4; 0.1; 0" dur="0.25s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="74; 84; 92; 100" dur="0.25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="44" cy="74" r="3" fill="#64748b" opacity="0.6">
      <animate attributeName="r" values="2; 8; 12; 0" dur="0.27s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7; 0.4; 0.1; 0" dur="0.27s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="74; 84; 92; 100" dur="0.27s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= RETRO RACING ARCADE HUD ================= -->
  <!-- Top Dashboard Bar -->
  <line x1="20" y1="46" x2="820" y2="46" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Left: Speedometer Gauge -->
  <text x="30" y="24" class="retro hudLabel">SPEED</text>
  <text x="30" y="40" class="retro hudSpeed">
    <tspan>248</tspan>
    <tspan font-size="9px" fill="#94a3b8"> KM/H</tspan>
  </text>

  <!-- Tachometer (RPM Bar) -->
  <rect x="130" y="28" width="80" height="10" fill="#0f172a" stroke="#334155" stroke-width="1" rx="2"/>
  <rect x="132" y="30" width="70" height="6" fill="#facc15" rx="1">
    <animate attributeName="width" values="68; 74; 66; 76; 72; 75" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#facc15; #ef4444; #facc15" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="130" y="22" class="retro hudLabel" font-size="8px">RPM x1000</text>

  <!-- Center: Score / Distance -->
  <text x="350" y="24" class="retro hudLabel">SCORE</text>
  <text x="350" y="40" class="retro hudValue">
    <tspan>142</tspan>
    <tspan>
      <animate attributeName="fill" values="#00ffcc;#ffffff;#00ffcc" dur="0.4s" repeatCount="indefinite"/>
      850
    </tspan>
  </text>

  <!-- Right: Nitro Tank Gauge -->
  <text x="610" y="24" class="retro hudLabel">NITRO</text>
  <rect x="610" y="28" width="90" height="10" fill="#0f172a" stroke="#00f5ff" stroke-width="1" rx="2"/>
  <rect x="612" y="30" width="78" height="6" fill="#00f5ff" rx="1">
    <animate attributeName="width" values="78; 86; 74; 84; 86" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#00f5ff; #38bdf8; #00f5ff" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="720" y="24" class="retro hudLabel">STAGE</text>
  <text x="720" y="40" class="retro hudValue">01</text>

  <!-- Bottom Arcade Bar -->
  <line x1="20" y1="424" x2="820" y2="424" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Left: Lap & Position -->
  <text x="30" y="444" class="retro hudLabel">POSITION:</text>
  <text x="110" y="444" class="retro hudValue">01/16</text>

  <!-- Center Flashing Arcade Message -->
  <text x="330" y="444" class="retro hudAlert">
    <animate attributeName="opacity" values="1; 0.15; 1" dur="0.8s" repeatCount="indefinite"/>
    TURBO ACTIVE
  </text>

  <!-- Right: Driver Identifier -->
  <text x="630" y="444" class="retro hudValue">DRIVER: TRIVALDO</text>
</svg>
